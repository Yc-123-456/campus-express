<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的订单 - 校园快递代取</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="dashboard.html">校园快递代取</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="dashboard.html">接单大厅</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="orders.html">我的订单</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="messages.html">
                            我的消息
                            <span class="badge bg-danger ms-1" id="navUnreadBadge" style="display: none;">0</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="profile.html">个人中心</a>
                    </li>
                    <li class="nav-item admin-only" style="display: none;">
                        <a class="nav-link" href="admin.html">管理后台</a>
                    </li>
                </ul>
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <span class="nav-link">欢迎, <span id="userDisplayName"></span></span>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" id="logoutBtn">退出登录</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- 主要内容 -->
    <div class="container mt-4">
        <!-- 标签页和筛选器 -->
        <div class="card mb-4 order-tabs-card">
            <!-- 标签页 -->
            <div class="order-tabs">
                <button type="button" class="order-tab active" id="btnPublished" onclick="switchTab('published')">
                    <span>我的订单</span>
                    <span class="tab-indicator"></span>
                </button>
                <button type="button" class="order-tab" id="btnAccepted" onclick="switchTab('accepted')">
                    <span>我的接单</span>
                    <span class="tab-indicator"></span>
                </button>
            </div>
            
            <!-- 筛选器 -->
            <div class="card-body filter-bar">
                <div class="row g-3">
                    <div class="col-md-4">
                        <div class="search-box">
                            <i class="search-icon">🔍</i>
                            <input type="text" class="form-control" id="searchInput" placeholder="搜索订单号、快递公司、对方...">
                        </div>
                    </div>
                    <div class="col-md-3">
                        <select class="form-select" id="statusFilter">
                            <option value="">全部状态</option>
                            <option value="pending">待取件</option>
                            <option value="accepted">已接单</option>
                            <option value="delivering">配送中</option>
                            <option value="delivered">已送达</option>
                            <option value="completed">已完成</option>
                            <option value="cancelled">已取消</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <select class="form-select" id="expressFilter">
                            <option value="">全部快递公司</option>
                            <option value="顺丰速运">顺丰速运</option>
                            <option value="中通快递">中通快递</option>
                            <option value="圆通速递">圆通速递</option>
                            <option value="申通快递">申通快递</option>
                            <option value="韵达快递">韵达快递</option>
                            <option value="邮政EMS">邮政EMS</option>
                            <option value="京东物流">京东物流</option>
                            <option value="德邦快递">德邦快递</option>
                            <option value="其他">其他</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <button class="btn btn-primary w-100" id="filterBtn">筛选</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 订单列表 -->
        <div class="card">
            <div class="card-body p-0">
                <div class="table-wrapper">
                    <table class="table order-table">
                        <thead>
                            <tr>
                                <th>订单号</th>
                                <th>快递公司</th>
                                <th>取件码</th>
                                <th>取件地点</th>
                                <th>费用</th>
                                <th>状态</th>
                                <th id="userColumnHeader">对方</th>
                                <th>创建时间</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="ordersTable">
                            <!-- 动态填充 -->
                        </tbody>
                    </table>
                </div>
                <!-- 分页 -->
                <div class="pagination-wrapper">
                    <nav aria-label="订单分页">
                        <ul class="pagination justify-content-center" id="pagination">
                            <!-- 动态填充 -->
                        </ul>
                    </nav>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dayjs/dayjs.min.js"></script>
    <script src="js/common.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/orders.js"></script>
    
    <!-- 用户信息模态框 -->
    <div class="modal fade" id="userProfileModal" tabindex="-1">
        <div class="modal-dialog modal-lg" id="userProfileModalDialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">用户信息</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="row mb-4">
                        <div class="col-md-6" id="profileBasicInfo">
                            <h6>基本信息</h6>
                            <p><strong>用户名：</strong><span id="profileUsername"></span></p>
                            <p><strong>真实姓名：</strong><span id="profileRealName"></span></p>
                            <p><strong>手机号：</strong><span id="profilePhone"></span></p>
                            <p><strong>邮箱：</strong><span id="profileEmail"></span></p>
                            <p><strong>学号：</strong><span id="profileStudentId"></span></p>
                        </div>
                        <div class="col-md-6" id="profileStatsSection">
                            <h6 id="profileStatsTitle">统计数据</h6>
                            <div class="row text-center">
                                <div class="col-6 mb-2">
                                    <div class="card bg-primary text-white">
                                        <div class="card-body py-2">
                                            <h6 class="mb-0">发布订单</h6>
                                            <h4 id="profilePublishCount">0</h4>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-6 mb-2">
                                    <div class="card bg-success text-white">
                                        <div class="card-body py-2">
                                            <h6 class="mb-0">接单数量</h6>
                                            <h4 id="profileAcceptCount">0</h4>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-6 mb-2">
                                    <div class="card bg-info text-white">
                                        <div class="card-body py-2">
                                            <h6 class="mb-0">完成订单</h6>
                                            <h4 id="profileCompleteCount">0</h4>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-6 mb-2">
                                    <div class="card bg-warning text-white">
                                        <div class="card-body py-2">
                                            <h6 class="mb-0">获得收益</h6>
                                            <h4 id="profileEarnings">￥0.00</h4>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">关闭</button>
                    <button type="button" class="btn btn-primary" id="createConversationBtn" onclick="handleCreateConversation()">
                        <i class="bi bi-chat-dots"></i> 创建对话
                    </button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
