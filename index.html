<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>校园快递代取系统 - 登录</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-bg">
    <div class="container">
        <div class="row justify-content-center align-items-center min-vh-100">
            <div class="col-md-6 col-lg-4">
                <div class="card login-card">
                    <div class="card-body">
                        <h2 class="text-center mb-4">校园快递代取</h2>
                        <form id="loginForm" autocomplete="off">
                            <div class="mb-3">
                                <label for="username" class="form-label">用户名</label>
                                <input type="text" class="form-control" id="username" required autocomplete="off">
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">密码</label>
                                <input type="password" class="form-control" id="password" required autocomplete="new-password">
                            </div>
                            <button type="submit" class="btn btn-primary w-100">登录</button>
                        </form>
                        <div class="text-center mt-3">
                            <a href="#" id="registerLink">还没有账号?立即注册</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dayjs/dayjs.min.js"></script>
    <script src="js/common.js"></script>
    <script src="js/auth.js"></script>

    <!-- 注册模态框 -->
    <div class="modal fade" id="registerModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">注册账号</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="registerForm" autocomplete="off">
                        <div class="mb-3">
                            <label for="regUsername" class="form-label">用户名 *</label>
                            <input type="text" class="form-control" id="regUsername" required placeholder="请输入用户名" autocomplete="off">
                        </div>
                        <div class="mb-3">
                            <label for="regPassword" class="form-label">密码 *</label>
                            <input type="password" class="form-control" id="regPassword" required placeholder="请输入密码" autocomplete="new-password">
                        </div>
                        <div class="mb-3">
                            <label for="regConfirmPassword" class="form-label">确认密码 *</label>
                            <input type="password" class="form-control" id="regConfirmPassword" required placeholder="请再次输入密码" autocomplete="new-password">
                        </div>
                        <div class="mb-3">
                            <label for="regRealName" class="form-label">真实姓名</label>
                            <input type="text" class="form-control" id="regRealName" placeholder="请输入真实姓名" autocomplete="off">
                        </div>
                        <div class="mb-3">
                            <label for="regPhone" class="form-label">手机号</label>
                            <input type="tel" class="form-control" id="regPhone" placeholder="请输入手机号" autocomplete="off">
                        </div>
                        <div class="mb-3">
                            <label for="regEmail" class="form-label">邮箱</label>
                            <input type="email" class="form-control" id="regEmail" placeholder="请输入邮箱" autocomplete="off">
                        </div>
                        <div class="mb-3">
                            <label for="regStudentId" class="form-label">学号</label>
                            <input type="text" class="form-control" id="regStudentId" placeholder="请输入学号" autocomplete="off">
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" id="submitRegisterBtn">注册</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
