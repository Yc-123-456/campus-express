<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>创建订单 - 校园快递代取</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="dashboard.html">校园快递代取</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="dashboard.html">首页</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="create_order.html">创建订单</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="orders.html">我的订单</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="messages.html">
                            我的消息
                            <span class="badge bg-danger ms-1" id="navUnreadBadge" style="display: none;">0</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="profile.html">个人中心</a>
                    </li>
                </ul>
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <span class="nav-link">欢迎, <span id="userDisplayName"></span></span>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" id="logoutBtn">退出登录</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- 主要内容 -->
    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header">
                        <h4 class="mb-0">创建新的代取订单</h4>
                    </div>
                    <div class="card-body">
                        <form id="createOrderForm">
                            <h5 class="mb-3">快递信息</h5>
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label for="expressCompany" class="form-label">快递公司 *</label>
                                    <select class="form-select" id="expressCompany" required>
                                        <option value="">请选择快递公司</option>
                                        <option value="顺丰速运">顺丰速运</option>
                                        <option value="中通快递">中通快递</option>
                                        <option value="圆通速递">圆通速递</option>
                                        <option value="申通快递">申通快递</option>
                                        <option value="韵达快递">韵达快递</option>
                                        <option value="邮政EMS">邮政EMS</option>
                                        <option value="京东物流">京东物流</option>
                                        <option value="德邦快递">德邦快递</option>
                                        <option value="其他">其他</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label for="trackingNumber" class="form-label">快递单号</label>
                                    <input type="text" class="form-control" id="trackingNumber">
                                </div>
                            </div>
                            
                            <div class="mb-3">
                                <label for="pickupCode" class="form-label">取件码 *</label>
                                <input type="text" class="form-control" id="pickupCode" placeholder="例如: 3-2-1024" required>
                            </div>

                            <hr>

                            <h5 class="mb-3">取件信息</h5>
                            <div class="mb-3">
                                <label for="pickupLocation" class="form-label">取件地点 *</label>
                                <input type="text" class="form-control" id="pickupLocation" placeholder="例如: 菜鸟驿站、快递点名称" required>
                            </div>

                            <div class="mb-3">
                                <label for="deliveryAddress" class="form-label">送达地址 *</label>
                                <textarea class="form-control" id="deliveryAddress" rows="2" placeholder="详细的宿舍或地址信息" required></textarea>
                            </div>

                            <hr>

                            <h5 class="mb-3">联系信息</h5>
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label for="contactName" class="form-label">联系人姓名 *</label>
                                    <input type="text" class="form-control" id="contactName" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="contactPhone" class="form-label">联系电话 *</label>
                                    <input type="tel" class="form-control" id="contactPhone" required>
                                </div>
                            </div>

                            <hr>

                            <h5 class="mb-3">费用信息</h5>
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label for="fee" class="form-label">代取费用 (元) *</label>
                                    <input type="number" class="form-control" id="fee" step="0.01" min="0" placeholder="0.00" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="reward" class="form-label">额外打赏 (元)</label>
                                    <input type="number" class="form-control" id="reward" step="0.01" min="0" placeholder="0.00" value="0">
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="remark" class="form-label">备注说明</label>
                                <textarea class="form-control" id="remark" rows="2" placeholder="其他需要说明的信息(可选)"></textarea>
                            </div>

                            <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                                <button type="reset" class="btn btn-secondary">重置</button>
                                <button type="submit" class="btn btn-primary">提交订单</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dayjs/dayjs.min.js"></script>
    <script src="js/common.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/create_order.js"></script>
</body>
</html>
